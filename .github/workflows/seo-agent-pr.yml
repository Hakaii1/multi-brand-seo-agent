name: SEO Agent — Generate & Verify Content PR

on:
  # Run weekly on Monday at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      brand:
        description: 'Target brand (brand-a or brand-b)'
        required: true
        default: 'brand-a'
        type: choice
        options:
          - brand-a
          - brand-b
      keyword:
        description: 'Target keyword for the generated post'
        required: true
        default: 'web development best practices'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-verify:
    name: Generate Content, Verify & Open PR
    runs-on: ubuntu-latest

    steps:
      # ── Setup ────────────────────────────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Generate Content ─────────────────────────────────────────────────

      - name: Generate SEO content via Groq AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: groq/compound-mini
        run: |
          # If triggered manually, use input values; otherwise pick next topic in queue
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRAND="${{ github.event.inputs.brand }}"
            KEYWORD="${{ github.event.inputs.keyword }}"
          else
            # Automated weekly schedule: pick dynamic topic from 10-topic queue based on week of year
            WEEK=$(date +%V)
            MOD=$((WEEK % 10))
            case $MOD in
              0) BRAND="brand-a"; KEYWORD="react server components performance" ;;
              1) BRAND="brand-b"; KEYWORD="core web vitals optimization guide" ;;
              2) BRAND="brand-a"; KEYWORD="edge computing web architecture" ;;
              3) BRAND="brand-b"; KEYWORD="structured data schema markup" ;;
              4) BRAND="brand-a"; KEYWORD="micro frontend architecture patterns" ;;
              5) BRAND="brand-b"; KEYWORD="canonical tag best practices" ;;
              6) BRAND="brand-a"; KEYWORD="typescript strict mode best practices" ;;
              7) BRAND="brand-b"; KEYWORD="xml sitemap crawl budget optimization" ;;
              8) BRAND="brand-a"; KEYWORD="incremental static regeneration guide" ;;
              9) BRAND="brand-b"; KEYWORD="programmatic seo architecture" ;;
            esac
          fi

          echo "🚀 Generating content for ${BRAND} with keyword: ${KEYWORD}"
          npx tsx scripts/generate-seo-post.ts --brand "$BRAND" --keyword "$KEYWORD"
          echo "GENERATED_BRAND=$BRAND" >> $GITHUB_ENV
          echo "GENERATED_KEYWORD=$KEYWORD" >> $GITHUB_ENV

      # ── Verify All Content ───────────────────────────────────────────────

      - name: Run verification engine on all content
        run: npx tsx scripts/verify-content.ts --all

      # ── Run Tests ────────────────────────────────────────────────────────

      - name: Run Vitest test suite
        run: npm test

      # ── Create PR ────────────────────────────────────────────────────────

      - name: Commit & Create Draft Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="content/seo-agent-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add content/
          git commit -m "content: add AI-generated post for ${{ env.GENERATED_BRAND }}" || echo "No changes to commit"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "📝 New AI Content: ${{ env.GENERATED_KEYWORD }}" \
            --body "## AI-Generated Content PR

            **Brand:** \`${{ env.GENERATED_BRAND }}\`
            **Keyword:** \`${{ env.GENERATED_KEYWORD }}\`
            **Model:** \`groq/compound-mini\`

            ### Verification Results
            - ✅ Zod frontmatter schema validated
            - ✅ No duplicate slugs or keyword cannibalization
            - ✅ Heading hierarchy (max 1 H1) verified
            - ✅ Link integrity checked
            - ✅ MDX syntax safeguard passed
            - ✅ Vitest suite passed

            ### Review Checklist
            - [ ] Content accuracy and quality reviewed
            - [ ] Brand tone consistency checked
            - [ ] Ready to merge" \
            --base main \
            --head "$BRANCH_NAME" \
            --draft || echo "PR created"
